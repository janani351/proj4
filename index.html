<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Student Records Manager</title><link rel="stylesheet" href="style.css"><script src="script.js" defer></script></head>
<body><main class="container"><header><p class="eyebrow">CAMPUS DIRECTORY</p><h1>Student Records</h1><p class="muted">A simple student information manager.</p></header><form id="student-form"><label>Student name<input id="name" maxlength="70" required placeholder="Student name"></label><label>Roll number<input id="roll" maxlength="20" required placeholder="Roll number"></label><label>Department<input id="department" maxlength="50" required placeholder="e.g. CSE"></label><button type="submit">Add student</button></form><div class="toolbar"><label class="search">Search records<input id="search" placeholder="Search name, roll or department"></label><span id="record-count" class="muted"></span></div><p id="message" aria-live="polite"></p><div class="table-wrap"><table><thead><tr><th>Name</th><th>Roll number</th><th>Department</th><th>Action</th></tr></thead><tbody id="rows"></tbody></table></div><p id="empty" class="empty">No records yet. Add a student above.</p></main></body></html>
